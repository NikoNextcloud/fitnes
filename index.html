<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0e15">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="IronForm — персонален тренировъчен план у дома, видео техника и мускулни илюстрации. Тренирай с увереност, без уреди.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>IronForm — Твоят тренировъчен ритъм</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='17' fill='%23ff5947'/%3E%3Cpath d='M22 15h20v7h-6v20h6v7H22v-7h6V22h-6z' fill='%230b0e15'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=premium-v4">
  <script defer src="anatomy.js?v=premium-v4"></script>
  <script defer src="exercise-data.js?v=premium-v4"></script>
  <script defer src="media-data.js?v=premium-v4"></script>
  <script defer src="legacy-media.js?v=premium-v4"></script>
  <script defer src="premium.js?v=premium-v4"></script>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <a class="brand" href="#home" data-nav="home" aria-label="IronForm — начало">
        <svg class="brand-symbol" viewBox="0 0 36 36" fill="none" aria-hidden="true"><rect width="36" height="36" rx="11" fill="currentColor"/><path d="M12 8h12v4h-4v12h4v4H12v-4h4V12h-4V8Z" fill="#0B0E15"/></svg>
        <span>ironform<span class="brand-dot">.</span></span>
      </a>
      <button class="header-action icon-button" type="button" data-action="settings" aria-label="Настройки">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9.5 3-.6 2.2-2 .9-2-.7-2 3.4L4.5 10v2l-1.6 1.4 2 3.4 2-.7 2 .9.6 2.2h4.7l.6-2.2 2-.9 2 .7 2-3.4-1.6-1.4v-2l1.6-1.4-2-3.4-2 .7-2-.9-.6-2.2Z"/><circle cx="11.9" cy="11.2" r="3"/></svg>
      </button>
    </header>

    <main class="app-main">
      <section class="view active" id="view-home" aria-label="Днес"><div id="homeContent"><div class="initial-loader" aria-live="polite"><span class="loader-mark"></span><p>Твоят следващ старт е тук.</p></div></div></section>
      <section class="view" id="view-discover" aria-label="Открий тренировка"><div id="discoverContent"></div></section>
      <section class="view" id="view-plan" aria-label="Моят план"><div id="planContent"></div></section>
      <section class="view" id="view-progress" aria-label="Моят прогрес"><div id="progressContent"></div></section>
    </main>

    <nav class="bottom-nav" aria-label="Основна навигация">
      <button class="active" type="button" data-nav="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 21v-8h6v8"/></svg><span>Днес</span></button>
      <button type="button" data-nav="discover"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m15.8 8.2-2.1 5.5-5.5 2.1 2.1-5.5z"/></svg><span>Открий</span></button>
      <button type="button" data-nav="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M16 3v4M8 3v4M3 11h18m-13 5h2m4 0h2"/></svg><span>План</span></button>
      <button type="button" data-nav="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10m8 10V4m8 16v-7"/><path d="m3 7 6-4 5 3 7-5"/></svg><span>Прогрес</span></button>
    </nav>
  </div>

  <dialog class="sheet" id="setupDialog" aria-label="Създай тренировъчен план"><div id="setupContent"></div></dialog>
  <dialog class="sheet" id="detailDialog" aria-label="Преглед на тренировка"><div id="detailContent"></div></dialog>
  <dialog class="player-dialog" id="workoutDialog" aria-label="Активна тренировка"><div id="workoutContent"></div></dialog>
  <dialog class="sheet" id="settingsDialog" aria-label="Настройки"><div id="settingsContent"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><div class="noscript-note">Включи JavaScript, за да използваш тренировъчния план.</div></noscript>
</body>
</html>
